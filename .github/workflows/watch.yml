name: Surveillance des sites

on:
  schedule:
    # Toutes les 5 minutes (le minimum autorisé par GitHub). Réservé à un dépôt public :
    # en privé, cela dépasse le quota gratuit. GitHub peut retarder ou sauter des exécutions.
    - cron: "*/5 * * * *"
  workflow_dispatch: # bouton « Run workflow » pour lancer une vérification à la main

permissions:
  contents: write # pour enregistrer state.json dans le dépôt

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Vérifier les sites
        run: python watcher.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Enregistrer l'état
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Mise à jour de l'état de surveillance"
            # Récupère d'éventuelles modifications faites entre-temps (ex. sites.yaml édité sur GitHub)
            git pull --rebase
            git push
          fi
